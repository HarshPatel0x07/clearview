# zcashd config for Clearview development.
#
# regtest = a private local chain. Blocks are mined on demand, instantly.
# No peers, no initial block download, no faucet, no multi-hour sync - and
# none of the memory pressure that OOM-kills zcashd on small machines during
# IBD (zcash/zcash#5936), because regtest never performs an IBD.
#
# Place at ~/.zcash/zcash.conf inside the Linux environment.

regtest=1

# RPC. These credentials are for a throwaway local chain with no real value.
# Change them anyway, and never reuse them anywhere that matters.
server=1
rpcuser=clearview
rpcpassword=CHANGE_ME_local_only
rpcallowip=127.0.0.1
rpcbind=127.0.0.1

# Keep the wallet able to hold and report shielded notes.
txindex=1
experimentalfeatures=1
lightwalletd=1

# Modest cache - regtest has almost no chain to hold.
dbcache=256
